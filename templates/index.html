<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <title>
        Traffic Science Fair
    </title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        #map {
            width: 100%;
            height: 80vh;
        }

    </style>

</head>


<body>

<h1>
    Traffic Science Fair System
</h1>

<p style="text-align:center;">
    自駕模式：多案例路線分析
</p>


<!-- ========================== -->
<!-- Case Selector -->
<!-- ========================== -->

    <div style="text-align:center; margin: 15px;">

        <label for="caseSelector">
            <b>選擇研究案例：</b>
        </label>

        <select id="caseSelector">

            <option value="1">
                桃園車站 → 台北車站
            </option>

            <option value="2">
                桃園車站 → 西門町
            </option>

            <option value="3">
                桃園車站 → 信義計畫區
            </option>

        </select>

    </div>


    <!-- Leaflet 地圖 -->
    <div id="map"></div>


    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- 我們自己的地圖程式 -->
    <script src="{{ url_for('static', filename='map.js') }}">
    </script>

</body>

</html>
